name: Reconcile unpublished OWID catalogue assets

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Hide unpublished assets removed from or redirected by OWID
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-production-owid-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Discover the current public OWID catalogue
        run: npm run ingest:owid:catalog -- --output "$RUNNER_TEMP/owid-catalog.csv"
      - name: Reconcile unpublished aliases
        run: >-
          npm run reconcile:owid-pending -- "$RUNNER_TEMP/owid-catalog.csv" --remote
          ${{ inputs.apply && '--apply' || '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
      - name: Verify OWID publication states
        run: >-
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json
          --command "SELECT status, rights_status, COUNT(*) AS asset_count
          FROM assets WHERE source_id = 'source_owid'
          GROUP BY status, rights_status ORDER BY status, rights_status;
          SELECT COUNT(*) AS pending_count FROM assets
          WHERE source_id = 'source_owid' AND status IN ('draft', 'review')"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
