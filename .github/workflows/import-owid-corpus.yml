name: Import OWID corpus to Cloudflare

on:
  workflow_dispatch:
    inputs:
      start:
        description: Zero-based normalized asset offset
        required: true
        default: "0"
      limit:
        description: Maximum assets to process
        required: true
        default: "3000"
      batch_size:
        description: Assets fetched and written per D1 batch
        required: true
        default: "25"

permissions:
  contents: read

concurrency:
  group: cloudflare-production-corpus-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate normalized 3,000-asset input
        run: npm run ingest:corpus -- data/seed/owid-all-3000.csv --expected-count 3000
      - name: Import selected corpus range
        run: >-
          npm run ingest:corpus -- data/seed/owid-all-3000.csv
          --expected-count 3000
          --start ${{ inputs.start }}
          --limit ${{ inputs.limit }}
          --batch-size ${{ inputs.batch_size }}
          --apply --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
      - name: Report production corpus counts
        if: always()
        run: >-
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json
          --command "SELECT s.id AS source_id, COUNT(a.id) AS asset_count,
          SUM(CASE WHEN a.status = 'published' THEN 1 ELSE 0 END) AS published_count,
          SUM(CASE WHEN a.status IN ('draft', 'review') THEN 1 ELSE 0 END) AS pending_review_count
          FROM sources s LEFT JOIN assets a ON a.source_id = s.id
          WHERE s.id = 'source_owid' GROUP BY s.id"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
