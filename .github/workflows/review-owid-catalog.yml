name: Review and publish imported OWID catalogue

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only OWID records that pass the asset-specific rights review
        required: true
        type: boolean
        default: true
      batch_size:
        description: Assets reviewed and written per D1 batch
        required: true
        default: "25"
      concurrency:
        description: Concurrent OWID rights evidence requests
        required: true
        default: "8"

permissions:
  contents: read

concurrency:
  group: cloudflare-production-owid-rights-catalog
  cancel-in-progress: false

jobs:
  review-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Discover the public OWID catalogue
        run: npm run ingest:owid:catalog -- --output "$RUNNER_TEMP/owid-catalog.csv"
      - name: Review asset-specific rights and publish safe records
        run: |
          OWID_COUNT=$(node -e 'const fs=require("node:fs"); process.stdout.write(String(fs.readFileSync(process.env.CATALOG,"utf8").trim().split(/\r?\n/).length-1))')
          npm run rights:owid-corpus -- "$RUNNER_TEMP/owid-catalog.csv" \
            --remote --limit "$OWID_COUNT" \
            --batch-size "${{ inputs.batch_size }}" \
            --concurrency "${{ inputs.concurrency }}" \
            --apply ${{ inputs.publish && '--publish' || '' }}
        env:
          CATALOG: ${{ runner.temp }}/owid-catalog.csv
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
      - name: Report OWID and global publication totals
        if: always()
        run: >-
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json
          --command "SELECT source_id, COUNT(*) AS asset_count,
          SUM(CASE WHEN status = 'published' THEN 1 ELSE 0 END) AS published_count,
          SUM(CASE WHEN status IN ('draft', 'review') THEN 1 ELSE 0 END) AS pending_review_count
          FROM assets WHERE source_id IN ('source_owid', 'source_eurostat') GROUP BY source_id;
          SELECT COUNT(*) AS total_assets, SUM(CASE WHEN status = 'published' THEN 1 ELSE 0 END) AS total_published FROM assets"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
