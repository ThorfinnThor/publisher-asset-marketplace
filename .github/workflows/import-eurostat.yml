name: Import and publish reviewed Eurostat catalogue

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only Eurostat records that pass the automated policy manifest
        required: true
        type: boolean
        default: true
      target:
        description: Minimum number of Eurostat table assets to publish
        required: true
        type: number
        default: 1000
      max_candidates:
        description: Maximum catalogue candidates to fetch while reaching the target
        required: true
        type: number
        default: 1500

permissions:
  contents: read

concurrency:
  group: cloudflare-production-eurostat
  cancel-in-progress: false

jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Discover and import the reviewed Eurostat catalogue batch
        run: >-
          npm run ingest:eurostat:catalog --
          --target ${{ inputs.target }}
          --max-candidates ${{ inputs.max_candidates }}
          --batch-size 50
          --manifest-out /tmp/eurostat-catalog-rights.json
          --apply --reviewed-rights --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
          MARKETPLACE_ORIGIN: https://publisher-asset-marketplace.shuu9599.workers.dev
      - name: Apply the reviewed rights manifest and publish safe records
        run: >-
          npm run rights:review --
          --source source_eurostat
          --manifest /tmp/eurostat-catalog-rights.json
          --remote --apply
          ${{ inputs.publish && '--publish' || '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
      - name: Verify production Eurostat catalogue count and rights
        if: ${{ inputs.publish }}
        run: >-
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json
          --command "SELECT COUNT(*) AS published_count,
          SUM(CASE WHEN json_extract(rights_json, '$.marketplace_rendered_embed_allowed') = 1 THEN 1 ELSE 0 END) AS marketplace_embed_count
          FROM assets WHERE source_id = 'source_eurostat' AND status = 'published'"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
      - name: Run production smoke including Eurostat embeds
        if: ${{ inputs.publish }}
        run: npm run release:smoke
      - name: Sample live Eurostat embeds across the catalogue
        if: ${{ inputs.publish }}
        run: npm run verify:eurostat:catalog -- --min ${{ inputs.target }} --sample 20
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
