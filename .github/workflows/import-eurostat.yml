name: Import and publish reviewed Eurostat pilots

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only Eurostat records that pass the reviewed rights manifest
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cloudflare-production-eurostat
  cancel-in-progress: false

jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate the reviewed Eurostat live fetch without writing D1
        run: npm run ingest:eurostat
      - name: Import the three reviewed datasets as draft records
        run: npm run ingest:eurostat -- --apply --reviewed-rights --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
      - name: Apply the reviewed rights manifest and publish safe records
        run: >-
          npm run rights:review --
          --source source_eurostat
          --manifest data/rights/eurostat-pilot-rights-review-v1.json
          --remote --apply
          ${{ inputs.publish && '--publish' || '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
      - name: Verify production Eurostat records
        run: >-
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json
          --command "SELECT slug, status, rights_status, license_code,
          json_extract(metadata_json, '$.source') AS source
          FROM assets WHERE source_id = 'source_eurostat' ORDER BY slug"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
