name: Import new OWID catalogue assets

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only assets that pass the asset-specific rights review
        required: true
        type: boolean
        default: true
      batch_size:
        description: Assets fetched and written per D1 batch
        required: true
        default: "10"

permissions:
  contents: read

concurrency:
  group: cloudflare-production-owid-missing
  cancel-in-progress: false

jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Discover the public OWID catalogue
        run: npm run ingest:owid:catalog -- --output "$RUNNER_TEMP/owid-catalog.csv"
      - name: Select catalogue assets missing from D1
        id: missing
        run: |
          npm run ingest:owid:missing -- "$RUNNER_TEMP/owid-catalog.csv" \
            --remote --output "$RUNNER_TEMP/owid-missing.csv"
          COUNT=$(node -e 'const fs=require("node:fs"); process.stdout.write(String(Math.max(0,fs.readFileSync(process.env.MISSING,"utf8").trim().split(/\r?\n/).length-1)))')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT new OWID catalogue assets"
        env:
          MISSING: ${{ runner.temp }}/owid-missing.csv
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
      - name: Import missing assets with bounded source retries
        if: steps.missing.outputs.count != '0'
        run: >-
          npm run ingest:corpus -- "$RUNNER_TEMP/owid-missing.csv"
          --expected-count "${{ steps.missing.outputs.count }}"
          --batch-size "${{ inputs.batch_size }}"
          --source-timeout-ms 45000 --source-attempts 4 --source-concurrency 2
          --allow-partial --apply --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
      - name: Review rights and publish successful imports
        if: steps.missing.outputs.count != '0'
        run: >-
          npm run rights:owid-corpus -- "$RUNNER_TEMP/owid-missing.csv"
          --remote --limit "${{ steps.missing.outputs.count }}"
          --batch-size "${{ inputs.batch_size }}" --concurrency 4
          --allow-empty --apply ${{ inputs.publish && '--publish' || '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
      - name: Audit publication gate
        if: steps.missing.outputs.count != '0' && inputs.publish
        run: npm run audit:import -- --remote --sample-size 5 --enforce-gate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
      - name: Report production totals
        if: always()
        run: >-
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json
          --command "SELECT source_id, COUNT(*) AS asset_count,
          SUM(CASE WHEN status = 'published' THEN 1 ELSE 0 END) AS published_count,
          SUM(CASE WHEN status IN ('draft', 'review') THEN 1 ELSE 0 END) AS pending_review_count
          FROM assets WHERE source_id = 'source_owid' GROUP BY source_id;
          SELECT COUNT(*) AS total_assets,
          SUM(CASE WHEN status = 'published' THEN 1 ELSE 0 END) AS total_published FROM assets"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
