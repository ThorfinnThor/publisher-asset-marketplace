name: Import and publish reviewed World Bank catalogue

on:
  workflow_dispatch:
    inputs:
      target:
        description: Number of data-backed CC BY-4.0 indicators to publish
        required: true
        type: number
        default: 2600
      max_candidates:
        description: Maximum unique indicator candidates to review
        required: true
        type: number
        default: 4000
      publish:
        description: Publish only indicators that pass the automated metadata review
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cloudflare-production-worldbank-catalog
  cancel-in-progress: false

jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Discover, verify and import World Bank indicators
        run: >-
          npm run ingest:worldbank:catalog --
          --target ${{ inputs.target }}
          --max-candidates ${{ inputs.max_candidates }}
          --batch-size 50
          --apply-batch-size 25
          --metadata-concurrency 8
          --manifest-out "$RUNNER_TEMP/worldbank-catalog-rights.json"
          --apply --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
      - name: Apply indicator-level rights evidence and publish safe records
        run: >-
          npm run rights:worldbank-catalog --
          --manifest "$RUNNER_TEMP/worldbank-catalog-rights.json"
          --remote --batch-size 25 --apply
          ${{ inputs.publish && '--publish' || '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
      - name: Verify World Bank and global totals
        run: >-
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --json
          --command "SELECT source_id, COUNT(*) AS asset_count,
          SUM(CASE WHEN status = 'published' THEN 1 ELSE 0 END) AS published_count,
          SUM(CASE WHEN rights_status = 'safe' THEN 1 ELSE 0 END) AS safe_count
          FROM assets GROUP BY source_id ORDER BY source_id;
          SELECT COUNT(*) AS total_assets,
          SUM(CASE WHEN status = 'published' THEN 1 ELSE 0 END) AS total_published
          FROM assets"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: 93b3f1b1-a71e-4387-bbfc-64d237e9551d
      - name: Run production smoke tests
        if: ${{ inputs.publish }}
        run: npm run release:smoke
